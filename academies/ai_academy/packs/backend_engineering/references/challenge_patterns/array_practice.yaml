id: "practice_array_indexing"
title: "Array Indexing Check"
duration_seconds: 180
questions:
  - id: "q1"
    type: "multiple_choice"
    prompt: "Given `fruits = ['apple', 'banana', 'cherry']`, what is `fruits[1]`?"
    options:
      - "apple"
      - "banana"
      - "cherry"
      - "IndexError"
    correct: 1
    explanation: "Indexing starts at 0. Index 1 is the second element: 'banana'."

  - id: "q2"
    type: "multiple_choice"
    prompt: "What does `range(1, 5)` produce?"
    options:
      - "[1, 2, 3, 4, 5]"
      - "[1, 2, 3, 4]"
      - "[0, 1, 2, 3, 4]"
      - "[0, 1, 2, 3]"
    correct: 1
    explanation: "`range(1, 5)` generates 1, 2, 3, 4. The end value is exclusive."

  - id: "q3"
    type: "multiple_choice"
    prompt: "You have `nums = [10, 20, 30]`. Which loop correctly sums ALL elements?"
    options:
      - "`for i in range(1, len(nums))`"
      - "`for i in range(0, len(nums))`"
      - "`for i in range(len(nums) + 1)`"
      - "`for i in range(len(nums) - 1)`"
    correct: 1
    explanation: "`range(0, len(nums))` visits every valid index: 0, 1, 2."
