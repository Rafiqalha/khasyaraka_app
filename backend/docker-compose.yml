version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pradigi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SangatRahasia123!
      POSTGRES_DB: pradigi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pradigi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: pradigi-server
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:SangatRahasia123!@db:5432/pradigi?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=SangatRahasia123!
      - PORT=8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
