id: python-control-flow
type: notebook
title: "Control Flow & Conditionals"
estimated_duration: "20m"
difficulty: beginner
depends:
  - python-variables
objective: "Master conditional logic branching with if, elif, else, comparison operators, and boolean algebra."
instructions: |
  1. Open condition.py in the Editor.
  2. Implement grade evaluation:
     - score >= 90: 'A'
     - score >= 80: 'B'
     - score >= 70: 'C'
     - else: 'D'
knowledge:
  teaches:
    - python.control_flow
workspace:
  template:
    file: condition.py
    content: |
      # 003: Control Flow
      def get_grade(score):
          if score >= 90:
              return 'A'
          elif score >= 80:
              return 'B'
          elif score >= 70:
              return 'C'
          else:
              return 'D'

      print(f"Grade for 85: {get_grade(85)}")
completion:
  run_tests:
    minimum_score: 80
reward:
  xp: 50
