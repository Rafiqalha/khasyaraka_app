version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pradigi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout_admin
      POSTGRES_PASSWORD: scout_password_local
      POSTGRES_DB: scout_os
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout_admin -d scout_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: pradigi_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pradigi_api
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - ../backend/.env
      - ../.env
    environment:
      PORT: "8080"
      ENVIRONMENT: development
      DATABASE_URL: postgres://scout_admin:scout_password_local@db:5432/scout_os?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-change-in-production
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
