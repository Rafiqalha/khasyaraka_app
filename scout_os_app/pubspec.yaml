name: scout_os_app
description: "Pradigi - AI Operating System for Learning, Capability Mastery, and Real-World Missions."
publish_to: 'none'

version: 1.1.5+14

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^3.3.2
  provider: ^6.1.2
  get: ^4.6.6

  # Design & Typography (Pradigi Design System)
  google_fonts: ^7.0.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.2.3
  shimmer: ^3.0.0
  font_awesome_flutter: ^11.0.0

  # Networking & Real-Time Communication
  dio: ^5.4.0
  http: ^1.6.0
  web_socket_channel: ^3.0.3

  # Code Editor & Terminal
  flutter_code_editor: ^0.3.5
  highlight: ^0.7.0

  # Local Persistence & Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Auth & Utilities
  google_sign_in: ^6.2.0
  intl: ^0.20.2
  uuid: ^4.6.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1

  # Workspace & Missions Hardware Sensors / Capabilities
  sensors_plus: ^5.0.1
  flutter_compass: ^0.8.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  vibration: ^3.1.5
  pedometer: ^4.1.1
  torch_light: ^1.1.0
  audioplayers: ^6.5.1
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/icons/cyber/cyber_logo.png
    - assets/icons/production/
    - assets/icons/google/
    - assets/icons/training/
    - assets/icons/navbar/
    - assets/audio/morse/beep_short.wav
    - assets/audio/morse/beep_long.wav
    - assets/audio/morse/sos/dot.wav
    - assets/audio/morse/sos/dash.wav
    - assets/audio/semaphore/flag_flap.wav
    - shorebird.yaml

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo/pradigi-logo-foreground.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/pradigi-logo-foreground.png"
