id: "post_assessment_arrays"
title: "Post-Journey Check"
description: "Administered AFTER the learning journey. Equivalent difficulty to pre-assessment but different surface."
timing: "post"
questions:
  - id: "post_1"
    type: "open_ended"
    prompt: |
      What will this code print?

      ```python
      scores = [90, 80, 70]
      for i in range(len(scores)):
          print(scores[i])
      ```
    expected_keywords:
      - "90"
      - "80"
      - "70"

  - id: "post_2"
    type: "multiple_choice"
    prompt: |
      If we change the loop to `range(1, len(scores))`, what happens?

      ```python
      scores = [90, 80, 70]
      for i in range(1, len(scores)):
          print(scores[i])
      ```
    options:
      - "It prints 90, 80, 70 normally"
      - "It prints 80, 70 — skipping the first element"
      - "It crashes with an IndexError"
      - "I don't know"
    correct: 1
