id: "pre_assessment_arrays"
title: "Baseline Check"
description: "Administered BEFORE the learning journey begins. Do not show hints or feedback."
timing: "pre"
questions:
  - id: "pre_1"
    type: "open_ended"
    prompt: |
      What will this code print?

      ```python
      numbers = [10, 20, 30, 40]
      for i in range(len(numbers)):
          print(numbers[i])
      ```
    expected_keywords:
      - "10"
      - "20"
      - "30"
      - "40"

  - id: "pre_2"
    type: "multiple_choice"
    prompt: |
      If we change the loop to `range(len(numbers) + 1)`, what happens?

      ```python
      numbers = [10, 20, 30, 40]
      for i in range(len(numbers) + 1):
          print(numbers[i])
      ```
    options:
      - "It prints 10, 20, 30, 40 normally"
      - "It prints 10, 20, 30, 40 and then crashes with an IndexError"
      - "It skips the first element"
      - "I don't know"
    correct: 1
